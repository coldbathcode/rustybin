services:
  rustybin:
    build: .
    container_name: rustybin
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RUSTYBIN_LOG_LEVEL=info
      - RUSTYBIN_INSTANCE_ID=rustybin-01
    volumes:
      - ./certs:/app/certs
    restart: unless-stopped

