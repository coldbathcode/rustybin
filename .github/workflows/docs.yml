name: Docs site

# Build the mdBook documentation and publish it to GitHub Pages
# (https://docs.rustybin.dev/) on every push to main.
# Requires Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.52
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook (pinned release binary)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" mdbook
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python3 docs/tools/check_includes.py
      - run: mdbook build docs
      - name: Check documentation links
        run: python3 docs/tools/check_links.py
      # Page views with Cloudflare Web Analytics (no cookies): set the
      # repository variable DOCS_ANALYTICS_TOKEN to the site token.
      - name: Add the analytics beacon
        if: vars.DOCS_ANALYTICS_TOKEN != ''
        env:
          DOCS_ANALYTICS_TOKEN: ${{ vars.DOCS_ANALYTICS_TOKEN }}
        run: python3 docs/tools/add_analytics.py docs/book "$DOCS_ANALYTICS_TOKEN"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
