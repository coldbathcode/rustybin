name: Docs site

# Build the mdBook documentation on every docs change, and publish it to
# GitHub Pages once Pages is set up. To enable publishing:
#   1. Settings > Pages > Source: "GitHub Actions"
#   2. Settings > Secrets and variables > Actions > Variables:
#      add PAGES_ENABLED = true
# Until then the book is still built and checked, but not deployed.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.52
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook (pinned release binary)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" mdbook
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python3 docs/tools/check_includes.py
      - run: mdbook build docs
      - name: Pages not enabled yet
        if: vars.PAGES_ENABLED != 'true'
        run: echo "::notice::Book built. Set the PAGES_ENABLED repository variable to true (after choosing Pages source 'GitHub Actions') to publish it."
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
