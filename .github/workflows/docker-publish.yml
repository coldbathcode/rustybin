name: Docker image

# Publishes the image to GitHub Container Registry so people can run Rustybin
# without building it:
#
#   docker run -d -p 8080:80 ghcr.io/coldbathcode/rustybin:latest
#
# Tags: `latest` and `edge` follow main; a release tag `vX.Y.Z` also pushes
# `X.Y.Z`, `X.Y` and `X`; every build pushes `sha-<commit>`. Multi-arch
# (linux/amd64 and linux/arm64). Every pushed image is signed with cosign
# (keyless, this workflow's GitHub identity), so a deployment can verify it:
#
#   cosign verify ghcr.io/coldbathcode/rustybin:latest \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/coldbathcode/rustybin/'
#
# The package must be made public once in the repository's package settings
# (GHCR packages start private).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless signing: the OIDC token names this workflow in the certificate.
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Rustybin
            org.opencontainers.image.description=HTTP stub service for API and AI gateway demos
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: sigstore/cosign-installer@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RUSTYBIN_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test the pushed image
        run: |
          docker run -d --name rb --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v rb-certs:/app/certs -e RUSTYBIN_USAGE_FILE=/app/certs/usage.json -p 8080:80 \
            "${IMAGE}:sha-$(git rev-parse --short=7 HEAD)" || \
          docker run -d --name rb --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v rb-certs:/app/certs -e RUSTYBIN_USAGE_FILE=/app/certs/usage.json -p 8080:80 \
            "$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          for i in $(seq 1 60); do curl -fs http://localhost:8080/_rustybin/ready >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/_rustybin/version | grep -q "${GITHUB_SHA:0:12}"
          curl -fsS http://localhost:8080/ui/ | grep -q '<html'
          curl -fsS -X POST http://localhost:8080/_rustybin/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/list' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | grep -q get_instance
          docker rm -f rb
      - name: sign the pushed image (keyless cosign, every tag by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          refs=""
          for tag in $TAGS; do refs="$refs ${tag%:*}@${DIGEST}"; done
          # One signature per digest; the tags all point at it.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/coldbathcode/rustybin/' > /dev/null
          echo "signed ${IMAGE}@${DIGEST} (tags:${refs})"
