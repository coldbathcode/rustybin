name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked

  quota-postgres:
    name: test (quota-postgres feature, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Enables the tests that need a running PostgreSQL (src/keys/pg_tests.rs).
      RUSTYBIN_TEST_QUOTA_STORE: postgres://postgres:dev@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked --features quota-postgres -- -D warnings
      - run: cargo test --all-targets --locked --features quota-postgres

  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-audit
      # RUSTSEC-2023-0071 (rsa, Marvin timing attack): no fixed release exists. Rustybin only uses
      # RSA to sign demo JWTs with throwaway keys it generates itself, never to decrypt or to
      # protect real secrets. Review 2027-04-01 or when rsa 0.10 is released.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  msrv:
    name: build (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo check --locked --features quota-postgres

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rustybin:ci
          load: true
          build-args: RUSTYBIN_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test the image
        run: |
          # Hardened: non-root, read-only root filesystem, no capabilities;
          # only /app/certs (demo PKI, usage file) is writable.
          docker run -d --name rb --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v rb-certs:/app/certs -e RUSTYBIN_USAGE_FILE=/app/certs/usage.json -e RUSTYBIN_PORTAL=on -p 8080:80 rustybin:ci
          for i in $(seq 1 60); do curl -fs http://localhost:8080/_rustybin/ready >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/health
          test "$(docker exec rb id -u)" = 10001
          docker exec rb test -s /app/certs/ca.crt
          # The default control auth: locked until the sign-in with rustybin / rustybin.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/_rustybin/version)" = 401
          TOKEN="$(curl -fsS -X POST http://localhost:8080/_rustybin/login -H 'Content-Type: application/json' \
            -d '{"username":"rustybin","password":"rustybin"}' | jq -r .token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/_rustybin/version | grep -q "${GITHUB_SHA:0:12}"
          # The console and the dev portal must be embedded in the image.
          curl -fsS http://localhost:8080/ui/ | grep -q '<html'
          curl -fsS http://localhost:8080/portal/ | grep -q '<html'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/_rustybin/catalog >/dev/null
          docker logs rb 2>&1 | grep -q "default password"
          docker logs rb
          docker rm -f rb
      - name: Harness conformance (the compose cluster, the leader killed mid-run)
        run: RUSTYBIN_IMAGE=rustybin:ci conformance/harness/run.sh

  no-dashes:
    name: no em or en dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-dashes.sh

  docs:
    name: docs (mdBook + tested examples)
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.52
      HURL_VERSION: 8.0.1
      GRPCURL_VERSION: 1.9.3
      WEBSOCAT_VERSION: 1.14.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdbook, hurl, grpcurl and websocat (pinned release binaries)
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$bin" mdbook
          curl -sSfL "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin/hurl" "$bin/"
          curl -sSfL "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz" \
            | tar -xz -C "$bin" grpcurl
          curl -sSfL -o "$bin/websocat" "https://github.com/vi/websocat/releases/download/v${WEBSOCAT_VERSION}/websocat.x86_64-unknown-linux-musl"
          chmod +x "$bin/websocat"
          echo "$bin" >> "$GITHUB_PATH"
      - run: mdbook --version && hurl --version && grpcurl -version && websocat --version
      - name: Check example includes and anchors
        run: python3 docs/tools/check_includes.py
      - name: Build the book
        run: mdbook build docs
      - name: Run every documentation example against a fresh server
        run: REQUIRE_ALL_TOOLS=1 docs/examples/run.sh

  conformance:
    name: SDK conformance (mock LLM, MCP, A2A, OAuth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: conformance/requirements.txt
      - run: python -m pip install -r conformance/requirements.txt
      - run: cargo build --locked
      - name: Mock LLM (openai, anthropic, google-genai, httpx)
        run: PYTHON=python conformance/ai/run.sh
      - name: MCP (Python MCP SDK; the Inspector CLI runs only with --inspector)
        run: PYTHON=python conformance/mcp/run.sh
      - name: A2A (a2a-sdk)
        run: PYTHON=python conformance/a2a/run.sh
      - name: OAuth / OIDC flows
        run: PYTHON=python conformance/oauth/run.sh
