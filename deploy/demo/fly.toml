# The public demo on Fly.io: visitors create mocks at demo.rustybin.dev without
# an account, each served at <name>.rustybin-mock.dev, and only the operator
# signs in. Deploy steps and the secrets it needs are in README.md here.
#
# The image is the signed release, pinned by digest: never `latest`.

app = "rustybin-demo"
primary_region = "lhr"

[build]
  image = "ghcr.io/coldbathcode/rustybin@sha256:492000348f22ebb73cd6197de2a07ea6bfc9a363b606b33dcf25b535e29cceb3"

[env]
  RUSTYBIN_PUBLIC_MODE = "true"
  RUSTYBIN_PLAN = "free"
  RUSTYBIN_INSTANCE_ID = "demo"
  RUSTYBIN_LOG_LEVEL = "info"
  RUSTYBIN_HTTP_PORT = "8080"
  RUSTYBIN_HTTPS_PORT = "0"
  RUSTYBIN_GRPC_PORT = "0"
  RUSTYBIN_INSPECTOR_CAPACITY = "200"
  # Fly's edge sets this header and a client cannot: never leave it at `any`.
  RUSTYBIN_TRUST_FORWARD = "true"
  RUSTYBIN_TRUST_FORWARD_HEADER = "fly"
  # Settings, sessions, the audit log and visitors' mocks survive a restart.
  RUSTYBIN_STATE_DIR = "/data"
  RUSTYBIN_USAGE_FILE = "/data/usage.json"
  # Visitors need no account; the password sign-in is the operator's alone.
  RUSTYBIN_CONSOLE_USER = "oli"
  RUSTYBIN_MOCKS_SAMPLE = "true"
  RUSTYBIN_MOCKS_SELF_SERVICE = "true"
  RUSTYBIN_MOCKS_SELF_SERVICE_HOST = "rustybin-mock.dev"
  RUSTYBIN_MOCKS_SELF_SERVICE_HOME = "https://demo.rustybin.dev"
  RUSTYBIN_PRIVACY_URL = "https://rustybin.dev/legal/privacy/"

[mounts]
  source = "rustybin_demo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine that stays up: visits and their clocks live in it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # The readiness probe, never /health, a demo toggle that may answer 503.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/_rustybin/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
