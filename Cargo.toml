[package]
name = "rustybin"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "HTTP stub service for API and AI gateway demos"
license = "AGPL-3.0-only"
default-run = "rustybin"

[lib]
name = "rustybin"
path = "src/lib.rs"

[[bin]]
name = "rustybin"
path = "src/main.rs"

[features]
default = []
# Shared quota store for shared mode (RUSTYBIN_QUOTA_STORE=postgres://...).
# Off by default: the default build, its MSRV and its dependency set do not change.
quota-postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls"]

[dependencies]
axum = { version = "0.8", features = ["ws", "macros", "http2"] }
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = { version = "0.42", features = ["serde", "serialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "request-id", "util", "set-header"] }
bytes = "1"
http-body = "1"
http-body-util = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
base64 = "0.22"
jsonwebtoken = "9"
rand = "0.8"
rcgen = "0.13"
rustls = "0.23"
rustls-pemfile = "2"
form_urlencoded = "1"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
rsa = "0.9"
x509-parser = "0.16"
async-stream = "0.3"
gethostname = "1"
async-graphql = "=7.0.17"
serde_yaml = "0.9"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
async-graphql-axum = "=7.0.17"
tonic = "0.12"
tonic-health = "0.12"
tonic-reflection = "0.12"
tonic-types = "0.12"
tonic-web = "0.12"
prost = "0.13"
flate2 = "1"
brotli = "8"
ruzstd = "0.9.1"
regex = "1"
regex-syntax = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "json", "stream"] }
webpki-roots = "1"
tokio-postgres = { version = "0.7.13", optional = true, default-features = false, features = ["runtime", "with-chrono-0_4"] }
tokio-postgres-rustls = { version = "0.14", optional = true, features = ["aws-lc-rs"] }
# Harness mode (docs/plans/harness.md): the load engine's HTTP client, TLS to
# targets, latency histograms and the descriptor limit.
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "http2"] }
tokio-rustls = "0.26"
hdrhistogram = { version = "7.5", default-features = false }
libc = "0.2"
# Settings store (docs/plans/next/step-01-foundations.md): secrets at rest.
chacha20poly1305 = "0.10"
zeroize = "1"
# Console sign-in (docs/plans/next/step-02-console-sign-in.md): argon2id password hashes.
argon2 = "0.5"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio-tungstenite = "0.24"
tempfile = "3"
# examples/ is found automatically (no [[example]] table: the Docker build copies
# Cargo.toml without examples/); `cargo test --all-targets` runs its tests.

# RSA key generation (startup, tests) is very slow without optimisations.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Keep debug builds lean: line tables for our crate, no debuginfo for deps.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
