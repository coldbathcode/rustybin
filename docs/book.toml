[book]
title = "Rustybin"
description = "Run, build and test mock APIs, AI providers and agents with Rustybin."
authors = ["Rustybin contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
additional-css = ["theme/rustybin.css"]
additional-js = ["theme/rustybin.js"]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
# Served from https://docs.rustybin.dev/ (GitHub Pages with a custom domain).
site-url = "/"
git-repository-url = "https://github.com/coldbathcode/rustybin"
edit-url-template = "https://github.com/coldbathcode/rustybin/edit/main/docs/{path}"

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 0
