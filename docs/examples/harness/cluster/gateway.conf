# The stand-in gateway of the compose cluster: a plain reverse proxy that
# round-robins over the two server nodes, keeps connections to them open,
# adds X-Forwarded-For to every request (which the report lists under
# "what the gateway changed", headers added) and a Via header to every
# answer. Replace it with the gateway under test.
worker_processes 2;
events {
    worker_connections 4096;
}
http {
    access_log off;
    upstream rustybin_servers {
        # The server nodes, as GET .../clusters/perf-1/upstreams lists them.
        server server-1:80;
        server server-2:80;
        keepalive 128;
    }
    # A per-key limit to give a rate-limit test something to find:
    # limit_req_zone $http_apikey zone=perkey:1m rate=100r/m;
    server {
        listen 80;
        location / {
            # limit_req zone=perkey burst=10 nodelay;
            # limit_req_status 429;
            proxy_pass http://rustybin_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_503;
            proxy_read_timeout 30s;
            proxy_buffering off;
            add_header Via "1.1 gateway" always;
        }
    }
}
